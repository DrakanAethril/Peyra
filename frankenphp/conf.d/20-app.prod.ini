; https://symfony.com/doc/current/performance.html#use-the-opcache-class-preloading
opcache.preload_user = www-data
opcache.preload = /app/config/preload.php
; https://symfony.com/doc/current/performance.html#don-t-check-php-files-timestamps
opcache.validate_timestamps = 0

; opcache.preload recompiles the whole container at every worker start, under this limit: the
; 128M default crash-loops the container once the application has grown (Formatool's experience).
memory_limit = 256M
