expose_php = 0
date.timezone = Europe/Paris
apc.enable_cli = 1
session.use_strict_mode = 1
; With lazy_write on, a read-only session is never rewritten, so its mtime stops moving and the
; native GC reaps it while the person is still working (a random logout, as Formatool found).
session.lazy_write = 0
zend.detect_unicode = 0

; Uploaded documents (scanned invoices, statements) stay well under this; the application's own
; upload policy (step 0.6) is the rule, these only have to sit above it.
upload_max_filesize = 32M
post_max_size = 33M

; https://symfony.com/doc/current/performance.html
realpath_cache_size = 4096K
realpath_cache_ttl = 600
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 32531
opcache.memory_consumption = 256
opcache.enable_file_override = 1
