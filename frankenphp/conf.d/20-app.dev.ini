; See https://docs.docker.com/desktop/features/networking/networking-how-tos/#connect-a-container-to-a-service-on-the-host
xdebug.client_host = host.docker.internal

; php.ini-development's 128M is too tight for a cold cache:clear with Xdebug loaded, and an
; out-of-memory there is silent: importmap:install, the next auto-script, never runs.
memory_limit = 1G
