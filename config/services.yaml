# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # The directory's client (App\Service\Identity\LdapDirectory). Tagged kernel.reset so that the
    # ext-ldap connection is dropped after each request: in worker mode the same instance lives as
    # long as the worker, and an idle timeout on the directory's side would otherwise break every
    # later sign-in of that worker (Formatool met it).
    Symfony\Component\Ldap\Adapter\ExtLdap\Adapter:
        factory: ['App\Security\LdapAdapterFactory', 'create']
        arguments:
            $host: '%env(LDAP_HOST)%'
            $port: '%env(int:LDAP_PORT)%'
            $encryption: '%env(LDAP_ENCRYPTION)%'
            $tlsCaCertPath: '%env(LDAP_TLS_CA_CERT_PATH)%'
        tags:
            - { name: 'kernel.reset', method: 'reset' }

    Symfony\Component\Ldap\Ldap:
        arguments: ['@Symfony\Component\Ldap\Adapter\ExtLdap\Adapter']

    Symfony\Component\Ldap\LdapInterface: '@Symfony\Component\Ldap\Ldap'

    App\Service\Identity\Directory: '@App\Service\Identity\LdapDirectory'

    # The client of the `documents.s3` storage (config/packages/flysystem.yaml), built only when
    # PEYRA_STORAGE=s3.
    peyra.s3_client:
        class: Aws\S3\S3Client
        factory: ['App\Service\Shared\Storage\S3ClientFactory', 'create']
        arguments:
            $region: '%env(S3_REGION)%'
            $accessKeyId: '%env(S3_ACCESS_KEY_ID)%'
            $secretAccessKey: '%env(S3_SECRET_ACCESS_KEY)%'
            $endpoint: '%env(S3_ENDPOINT)%'

    # The HTTP client the Mercure hub publishes with (config/packages/mercure.yaml): short, so that a
    # hub that does not answer costs a request three seconds at most (App\Service\Shared\LivePublisher).
    mercure.http_client:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: ['@http_client', 'withOptions']
        arguments: [{ timeout: 3, max_duration: 3 }]

when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        # The suite never reaches the directory: an in-memory one holds the people of
        # frankenphp/ldap/10-tree.ldif. LdapDirectoryTest reads the real one.
        App\Tests\Support\InMemoryDirectory:
            public: true

        App\Service\Identity\Directory: '@App\Tests\Support\InMemoryDirectory'

        # Not used by any screen yet: kept in the container for their tests (step 0.6).
        App\Service\Shared\Storage\DossierFiles:
            public: true

        App\Service\Shared\Pdf\PdfRenderer:
            public: true

        App\Service\Shared\LivePublisher:
            public: true

        # Read by the calculations of the later steps (step 1.1).
        App\Service\Dossier\DossierClock:
            public: true

        # The sign-in limiters' counters (config/packages/framework.yaml, when@test).
        test.rate_limiter_storage:
            class: Symfony\Component\RateLimiter\Storage\InMemoryStorage
