  # --- Réduction générale 2025 ------------------------------------------------------------------
  - key: social.general_reduction.regime
    label: Réduction générale - formule du millésime
    value: rgcp
    unit: text
    effective_from: 2025-01-01
    source_url: https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006073189/LEGISCTA000006185779/2025-10-03
    consulted_on: 2026-11-28
    verified: true
    note: >-
      « rgcp » - la réduction générale des cotisations patronales de l'article D241-7 CSS (version du 7 avril
      2025), lue sous social.general_reduction.parameters ; « rgdu » à partir du 1er janvier 2026. Le moteur de
      bulletin choisit la formule par cette valeur (étape 4.3b).
  - key: social.general_reduction.parameters
    label: Réduction générale des cotisations patronales (RGCP) - paramètres 2025
    value:
      formula: "C = (T ÷ 0,6) × (1,6 × SMIC annuel ÷ rémunération annuelle brute − 1)"
      exit_threshold_smic: 1.6
      smic_reference: "SMIC en vigueur au 1er janvier 2025 (11,88 €), même en cas de revalorisation"
      smic_monthly_reference: 1801.80
      smic_hourly_reference: 11.88
      smic_annual: "1 820 × SMIC horaire (temps plein), ajusté temps partiel / absences, majoré des HS et HC"
      t: {lt_50: 0.3194, ge_50: 0.3234}
      coefficient_decimals: 4
    unit: coefficient
    effective_from: 2025-01-01
