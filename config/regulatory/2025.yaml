# Peyra - paramètres réglementaires, millésime 2025 : les valeurs datées que les calculs lisent à la
# date du dossier (App\Service\Regulatory\RegulatoryReader). Installées par app:regulatory:sync à
# chaque déploiement ; un administrateur les complète sous Paramètres › Paramètres réglementaires.
#
# Une entrée :
#
#   - key: social.smic_hourly        # domaine.nom, en anglais et snake_case ; domaines : social,
# fiscal
#     label: SMIC horaire brut       # le libellé affiché
#     value: 12.02                   # un nombre, un texte, ou une structure (tableau, liste de
# tranches)
#     unit: EUR/heure                # percent (6.90 = 6,90 %), EUR, EUR/mois, coefficient, text…
#     effective_from: 2025-01-01     # date d’effet ; un changement déjà connu pour l’an prochain a
# sa place ici
#     source_url: https://www.urssaf.fr/…   # la page officielle lue
#     consulted_on: 2026-11-27       # le jour où elle a été lue
#     verified: true                 # true seulement si la valeur a été lue sur la source ; sinon
# false
#     note: …                        # facultatif
#
# Une même clé peut revenir à plusieurs dates d'effet (SMIC de janvier et de juin). Corriger une
# valeur déjà installée, c'est la réécrire ici : la synchronisation ajoute une ligne qui la remplace
# et garde l'ancienne dans l'historique ; elle ne touche jamais à une valeur saisie par un
# administrateur. Les données préparées pour Peyra (sources, marques verified) entrent ici avec les
# modules qui les lisent : TVA et fiscalité au lot 3, paie au lot 4.
#
# Les valeurs sociales (lot 4, étape 4.1) viennent des données préparées pour Peyra
# (plan/donnees/reglementaire/social-2025.yaml, recherche du 27/11/2026), sources et marques
# verified gardées. Écarts avec elles : les taux d'exemple d'accident du travail et de versement
# mobilité n'y sont pas (ce sont des données de l'établissement, saisies dans Paie et social ›
# Paramètres de paie) ; maladie et allocations familiales gardent leur taux réduit et son seuil,
# mais leur taux plein se lit sous employer_rate comme en 2026 ; la majoration des heures
# complémentaires est ajoutée (service-public, 28/11/2026).
