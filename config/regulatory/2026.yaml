  # --- Tranches de rémunération -------------------------------------------------------------------
  - key: social.ceiling_proration
    label: Plafond du mois - proratisation (entrée, sortie, absence sans aucun versement)
    value: "Plafond mensuel × nombre de jours calendaires de la période d'emploi ÷ nombre de jours calendaires du mois ; la période d'emploi perd les journées entières d'absence qui n'ont donné lieu à aucun versement, même partiel. Une absence d'une ou plusieurs heures ou demi-journées, les congés payés, une absence en partie payée par l'employeur (maintien de salaire), les jours non travaillés d'un temps partiel ne réduisent pas le plafond."
    unit: text
    effective_from: 2018-01-01
    source_url: https://www.net-entreprises.fr/media/documentation/dsn-rubrique-unite-de-mesure-valeur40.pdf
    consulted_on: 2026-11-28
    verified: true
    note: >-
      Fiche consigne DSN 2713 (net-entreprises, décembre 2025), « Les règles de calcul », qui reprend l'article
      R. 242-2 du code de la sécurité sociale (décret n° 2017-858) et la fiche « Assiette générale » du BOSS
      (§ 850, 930, 940) ; exemple 7 : embauche le 15 janvier, 17 jours. L'arrondi du plafond proratisé au centime
      n'est pas écrit dans la fiche (choix du moteur, A-VERIFIER).
  - key: social.ceiling_brackets
    label: Tranches de rémunération, en plafonds de la sécurité sociale
    value:
      tranche_1: {from: 0, to: 1}
      tranche_2: {from: 1, to: 8}
      tranches_1_2: {from: 0, to: 8}
      four_ceilings: {from: 0, to: 4}
    unit: PSS
    effective_from: 2019-01-01
    source_url: https://reglementation.agirc-arrco.fr/home/baremes/listes-area/baremes-1/cotisations-au-regime-agirc-arrco-en-2026.html
    consulted_on: 2026-11-28
    verified: true
    note: Tranche 1 de 0 à 1 PSS et tranche 2 de 1 à 8 PSS (Agirc-Arrco, depuis le régime unifié de 2019) ; 4 PSS pour l'assurance chômage, l'AGS et l'Apec (urssaf.fr, assurance chômage et AGS). Bornes en plafonds mensuels sur un bulletin mensuel ; la borne basse incluse, la haute exclue.

