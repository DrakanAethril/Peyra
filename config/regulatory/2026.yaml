    verified: true
    note: >-
      « rgdu » - la réduction générale dégressive unique (art. 18 LFSS 2025, décrets n° 2025-887 et 2025-1446),
      pour les périodes d'emploi à compter du 1er janvier 2026, lue sous social.rgdu.parameters. Le moteur de
      bulletin choisit la formule par cette valeur (étape 4.3b).
  - key: social.rgdu.parameters
    label: Réduction générale dégressive unique (RGDU) - paramètres
    value:
      t_min: 0.0200
      t_delta: {lt_50: 0.3781, ge_50: 0.3821}
      coefficient_max: {lt_50: 0.3981, ge_50: 0.4021}
      exponent_p: 1.75
      exit_threshold_smic: 3
      smic_reference: "SMIC en vigueur au 1er janvier 2026 (12,02 €), même après la revalorisation du 1er juin 2026"
      smic_monthly_reference: 1823.03
      smic_hourly_reference: 12.02
      formula: "C = Tmin + Tdelta × [ ½ × (3 × SMIC annuel ÷ rémunération annuelle brute − 1) ]^P"
      coefficient_decimals: 4
    unit: coefficient
    effective_from: 2026-01-01
    source_url: https://www.urssaf.fr/accueil/employeur/beneficier-exonerations/reduction-generale-cotisation.html
    consulted_on: 2026-11-27
    verified: true
    note: >-
      Lu sur urssaf.fr (mis à jour 13/07/2026) et dans la table des paramètres du BOSS (COT_RGDU_Tmin = 2,
      Tdelta 37,81 / 38,21). Arrondi à 4 décimales : règle lue pour 2025 (D241-7) et appliquée par les exemples
      Urssaf 2026, non relue dans le texte 2026. Voir LISEZ-MOI.md pour la formule détaillée et l'exemple.
      Relu le 28/11/2026 sur entreprendre.service-public.gouv.fr (F24542) - Tmin 0,0200, Tdelta 0,3781 / 0,3821,
      P 1,75, SMIC calculé pour un an 21 876,40 € (valeur du 1er janvier 2026 conservée), coefficient
      « arrondi à quatre décimales, au dix millième le plus proche », au plus Tmin + Tdelta. La FAQ Agirc-Arrco
      d'avril 2026 donne 0,3773 / 0,3813 (A-VERIFIER).
