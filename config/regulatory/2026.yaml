  # --- Apprenti et fin de contrat (étape 4.3e) ---------------------------------------------------
  - key: social.apprentice.exemption
    label: Apprentis - part du SMIC exonérée de cotisations salariales (et de CSG/CRDS) selon la date du contrat
    value: {regime_from: "2025-03-01", smic_share: 50, former_smic_share: 79}
    unit: percent of SMIC
    effective_from: 2025-01-01
    source_url: https://www.service-public.gouv.fr/particuliers/vosdroits/F2918
    consulted_on: 2026-11-28
    verified: true
    note: >-
      Contrats débutant à partir du 1er mars 2025 : « salaire de l'apprenti exonéré de cotisations salariales dans la
      limite de 50 % du Smic » et « exonéré de CSG et de CRDS dans la limite de 50 % du Smic » ; contrats débutant au
      plus tard le 28 février 2025 : cotisations salariales « dans la limite de 79 % du Smic », « salaire exonéré de
      CSG et de CRDS » (page vérifiée le 08/09/2026 ; décret 2025-290). Le moteur lit le SMIC mensuel du jour
      (social.smic_monthly), proratise le seuil aux jours de la période d'emploi d'un mois d'entrée ou de sortie (pas au
      temps partiel ni aux absences, selon des sources secondaires) et n'exonère que les cotisations salariales dont le
      taux est réglementaire (non relu sur le BOSS, injoignable).
