# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # In production Peyra answers behind the establishment's nginx (README of the plan, § 9), which
    # says who the client is and that they came in HTTPS through the X-Forwarded-* headers. Those
    # headers are believed only from the addresses listed here: the nginx machine (or REMOTE_ADDR
    # when the port is closed to everybody else). Empty in development: the headers are ignored.
    # Without it, the sign-in journal and the limiters see nginx's address, links say `http` and
    # the session cookie loses `secure`.
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-host', 'x-forwarded-port']

    # Tokens kept in the session (the sign-in form, the sign-out link, every POST of a screen).
    csrf_protection: true

    # Started only when read or written. Stored under var/sessions, which compose.prod.yaml keeps
    # on a volume so that a rebuilt container signs nobody out. The cookie dies with the browser
    # (a shared classroom machine), and 8 hours without a request ends a session: a school day,
    # the figure Formatool settled on.
    session:
        handler_id: null
        save_path: '%kernel.project_dir%/var/sessions/%kernel.environment%'
        cookie_lifetime: 0
        gc_maxlifetime: 28800
        # `auto`: secure when the request is (directly, or as a trusted proxy says). Production
        # forces it below. Lax keeps the cookie off cross-site posts.
        cookie_secure: auto
        cookie_samesite: lax

    # Sign-in attempts (App\Security\LdapAuthenticator): per address, generous enough for a class
    # behind the school's single NAT address; per login, low enough to stop a guess at a password
    # and high enough for a student who mistypes it a few times.
    rate_limiter:
        login_ip:
            policy: sliding_window
            limit: 150
            interval: '15 minutes'
        login_name:
            policy: sliding_window
            limit: 8
            interval: '15 minutes'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
        # The suite signs in hundreds of times from 127.0.0.1: counters live in memory, one kernel
        # at a time. Not in an array cache pool: the services resetter empties those between two
        # requests of a client whose kernel is kept (KernelBrowser::disableReboot()).
        rate_limiter:
            login_ip:
                storage_service: test.rate_limiter_storage
            login_name:
                storage_service: test.rate_limiter_storage

when@prod:
    framework:
        # People only ever reach production in HTTPS (nginx): the cookie never travels in clear,
        # whatever a misconfigured proxy list makes the request look like.
        session:
            cookie_secure: true
