doctrine_migrations:
    migrations_paths:
        # namespace is arbitrary but should be different from App\Migrations
        # as migrations classes should NOT be autoloaded
        'DoctrineMigrations': '%kernel.project_dir%/migrations'
    enable_profiler: false
    # MariaDB commits implicitly before and after every DDL statement: a migration wrapped in a
    # transaction is not one, and doctrine/migrations logs a deprecation at each deploy saying so.
    # This makes `make:migration` / `doctrine:migrations:diff` write `isTransactional(): false` in
    # each new migration (ProductionConfigurationTest checks every file says so); it changes nothing
    # in a migration that does not. The entrypoint therefore migrates without --all-or-nothing.
    transactional: false
