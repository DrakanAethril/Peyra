# Peyra - le référentiel du BTS Comptabilité et gestion, en données (App\Service\Shared\Referential\
# Referential le lit et le vérifie entier). Les missions visent ses activités, la correction positionne
# par activité, le passeport professionnel et le mode épreuve lisent ses épreuves.
#
# Source : référentiel annexé à l'arrêté du 3 novembre 2014 modifié (arrêtés du 9 juin 2016 et du
# 15 septembre 2016, NOR MENS1624975A), document « Référentiel d'activité, de compétences et
# d'évaluation » de la fiche RNCP 39159, lu le 2026-11-27 (pages 8, 11 à 21, 93-94, 98 à 108).
# Les intitulés sont recopiés du texte, graphies comprises (« Elaboration », « mise en oeuvre ») ;
# retouches : ponctuation finale des composantes supprimée, apostrophes typographiques, codes
# préfixés de « A » comme le règlement d'examen les écrit (A1.2, A1.2.1). `note` signale un écart
# avec la page des référents, où le texte l'emporte.
#
# Un référentiel rénové sera un autre fichier, avec son `edition` : les codes visés par une mission
# se lisent dans l'édition où elle a été composée.
#
# Épreuves d'une composante : celles de son activité, sauf mention. Règle du règlement d'examen :
# P1 à P4 relèvent de E41 et E42 sauf A1.1, A1.7, A2.1, A2.8, A3.1, A4.1, A4.4, A3.2.5 et A3.3.8
# (E6) ; P5 et P6 de E5 ; P7 de E41, E42 et E5.
edition: '2014'
diploma: BTS Comptabilité et gestion
rncp: RNCP39159
text: Arrêté du 3 novembre 2014 modifié par les arrêtés du 9 juin 2016 et du 15 septembre 2016 (NOR MENS1624975A)
source_url: https://www.francecompetences.fr/recherche/rncp/39159/
consulted_on: 2026-11-27

exams:
  - code: E41
    unit: U41
    title: Étude de cas
    coefficient: 9
    form: "Écrite, 4 h 30 (ponctuelle, ou CCF : une situation écrite dans les mêmes conditions en 2e année)"
    on_workstation: false
    verified: true
  - code: E42
    unit: U42
    title: Pratiques comptables fiscales et sociales
    coefficient: 4
    form: "CCF, deux situations d’évaluation ; ponctuelle, orale et pratique, 30 minutes, 15 minutes de préparation"
    on_workstation: true
    verified: true
  - code: E5
    unit: U5
    title: Situations de contrôle de gestion et d’analyse financière
    coefficient: 5
    form: "CCF, deux situations d’évaluation ; ponctuelle, orale, 30 minutes, 30 minutes de préparation"
    on_workstation: true
    verified: true
  - code: E6
    unit: U6
    title: Parcours de professionnalisation
    coefficient: 5
    form: "Ponctuelle orale, 30 minutes"
    on_workstation: false
    verified: true

processes:
  - code: P1
    title: Contrôle et traitement comptable des opérations commerciales
    verified: true
    activities:
      - code: A1.1
        title: Analyse du système d’information comptable (SIC)
        exams: [E6]
        verified: true
        components:
          - {code: A1.1.1, title: "Identification des caractéristiques du SIC dans l’entreprise et ses acteurs"}
          - {code: A1.1.2, title: "Repérage de l’organisation comptable : la hiérarchie des travaux comptables"}
          - {code: A1.1.3, title: "Repérage des sources du droit comptable et des obligations liées à l’exercice du métier"}
          - {code: A1.1.4, title: "Analyse et description des mécanismes comptables : les modèles comptables, les principes d’enregistrement"}
      - code: A1.2
        title: Contrôle des documents commerciaux
        exams: [E41, E42]
        verified: true
        components:
          - {code: A1.2.1, title: "Tenue et suivi des dossiers clients : du contrôle du devis au contrôle de l’encaissement"}
          - {code: A1.2.2, title: "Tenue et suivi des dossiers fournisseurs : du contrôle de la commande au contrôle du règlement"}
          - {code: A1.2.3, title: "Contrôle des opérations et des traitements dématérialisés"}
          - {code: A1.2.4, title: "Conception des procédures d’archivage des documents commerciaux dans le respect des procédures comptables"}
      - code: A1.3
        title: Enregistrement et suivi des opérations comptables relatives aux clients
        exams: [E41, E42]
        verified: true
        components:
          - {code: A1.3.1, title: "Enregistrement, contrôle et validation des opérations relatives aux clients (y compris celles générées par le PGI)"}
          - {code: A1.3.2, title: "Suivi des créances, contrôle et lettrage"}
          - {code: A1.3.3, title: "Enregistrement, suivi des effets de commerce créés"}
      - code: A1.4
        title: Production de l’information relative au risque client
        exams: [E41, E42]
        verified: true
        components:
          - {code: A1.4.1, title: "Analyse de la composition du portefeuille client et de son évolution"}
          - {code: A1.4.2, title: "Alerte, conseil pour réduire le risque client"}
          - {code: A1.4.3, title: "Relance des clients"}
      - code: A1.5
        title: Enregistrement et suivi des opérations relatives aux fournisseurs
        exams: [E41, E42]
        verified: true
        components:
          - {code: A1.5.1, title: "Recherche des informations, y compris techniques, relatives aux factures fournisseurs"}
          - {code: A1.5.2, title: "Vérification et validation des factures d’achat de bien, de service et/ou d’acquisition d’immobilisation"}
          - {code: A1.5.3, title: "Mise en évidence et traitement des anomalies dans le processus achat"}
          - {code: A1.5.4, title: "Enregistrement des factures d’achat de bien, de service et/ou d’acquisition d’immobilisation"}
          - {code: A1.5.5, title: "Gestion des échéances relatives aux règlements des fournisseurs"}
          - {code: A1.5.6, title: "Enregistrements relatifs aux opérations de financement"}
      - code: A1.6
        title: Réalisation des rapprochements bancaires (comptabilité de trésorerie)
        exams: [E41, E42]
        verified: true
        components:
          - {code: A1.6.1, title: "Pointage des relevés et des comptes bancaires"}
          - {code: A1.6.2, title: "Réalisation d’un état de rapprochement"}
          - {code: A1.6.3, title: "Enregistrement des écritures de régularisation suite au rapprochement bancaire"}
      - code: A1.7
        title: "Contribution à la performance du processus « Contrôle et traitement comptable des opérations commerciales » et la recherche de la sécurisation des opérations"
        exams: [E6]
        verified: true
        components:
          - {code: A1.7.1, title: "Présentation des caractéristiques de l’organisation du processus « Contrôle et traitement des opérations commerciales »"}
          - {code: A1.7.2, title: "Analyse du processus « Contrôle et traitement comptable des opérations commerciales »"}

  - code: P2
    title: Contrôle et production de l’information financière
    verified: true
