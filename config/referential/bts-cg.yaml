          - {code: A2.3.1, title: "Réalisation, enregistrement, contrôle des travaux d’inventaire relatif aux clients, aux fournisseurs et aux stocks"}
          - {code: A2.3.2, title: "Réalisation, enregistrement, contrôle des travaux d’inventaire relatifs aux immobilisations"}
          - {code: A2.3.3, title: "Ajustement des comptes de gestion et apurement des comptes d’attente"}
          - {code: A2.3.4, title: "Traitement des provisions réglementées et des amortissements exceptionnels"}
          - {code: A2.3.5, title: "Réalisation des contrôles nécessaires et proposition d’évolutions dans les procédures d’inventaire – Mise à jour du dossier de révision"}
      - code: A2.4
        title: Production des comptes annuels et des situations intermédiaires
        exams: [E41, E42]
        verified: true
        components:
          - {code: A2.4.1, title: "Identification des opérations à réaliser pour la production des comptes annuels et des situations intermédiaires"}
          - {code: A2.4.2, title: "Préparation des comptes annuels et des situations intermédiaires"}
          - {code: A2.4.3, title: "Présentation des projets de comptes annuels ou de situations intermédiaires"}
      - code: A2.5
        title: Suivi comptable des travaux relatifs à l’affectation des résultats
        exams: [E41, E42]
        verified: true
        components:
          - {code: A2.5.1, title: "Présentation d’un projet de répartition du résultat aux organes de direction"}
          - {code: A2.5.2, title: "Enregistrement des opérations comptables nécessaires et obligatoires"}
          - {code: A2.5.3, title: "Mise à jour des documents de synthèse suite à la répartition du résultat"}
      - code: A2.6
        title: Sauvegarde et archivage des documents comptables
        exams: [E41, E42]
        verified: true
        components:
          - {code: A2.6.1, title: "Sauvegarde et archivage des documents de synthèse et des situations intermédiaires"}
          - {code: A2.6.2, title: "Réponse à une demande de contrôle extérieure"}
      - code: A2.7
        title: Production d’informations nécessaires à la consolidation
        note: "La page des référents écrit « Contribution à la production d’informations… » ; le texte dit « Production d’informations nécessaires à la consolidation »."
        exams: [E41, E42]
        verified: true
        components:
          - {code: A2.7.1, title: "Caractérisation de l’entreprise dans le périmètre de consolidation"}
          - {code: A2.7.2, title: "Participation à la réalisation de retraitements simples"}
      - code: A2.8
        title: "Contribution à la performance du processus « Contrôle et production de l’information financière » et la recherche de la sécurisation des opérations"
        exams: [E6]
        verified: true
        components:
          - {code: A2.8.1, title: "Présentation des caractéristiques de l’organisation du processus « Contrôle et production de l’information financière »"}
          - {code: A2.8.2, title: "Analyse du processus « Contrôle et production de l’information financière »"}

