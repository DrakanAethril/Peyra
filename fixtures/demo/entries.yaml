# Menuiserie Vasseur SARL - its entries, installed by app:demo:install through the Ledger, each
# checked like any other entry: the first quarter of 2026.
#
# - The opening balance of the exercise 2026 (à-nouveaux of the 01/01/2026, journal AN): the
#   closing balance of 2025 before the allocation of its result (120000 carries the profit of
#   2025), 459 260,31 on each side.
# - January, the 80 entries of operations-2026.md § 2.2 (OD, ACH, VTE, BQ1, BQ2: extournes,
#   invoices, bank, VAT liquidation); 512100 = 31 090,29 D at 31/01, as § 2.5 says.
# - February and March, generated towards the targets of § 3 and § 4 (sales, purchases, the
#   Hartmann intra-community purchase, the deposit and the invoice of the machining centre, the
#   loan of March, the first instalment of corporate tax, February's VAT liquidated;
#   512100 = 13 883,89 D at 28/02 and 27 600,29 D at
#   31/03). March's VAT is left to liquidate; the rent and the lease of March come from the
#   subscriptions (subscriptions.yaml), into the brouillard.
# - Validated, but for the last entries of March, left in the brouillard (`validated: false`).
# - No payroll of 2026 here (review 4.7a): the payslips of fixtures/demo/payslips.yaml write the
#   month's entries (PAIE-2026-01…), the salaries (VIRSAL-…) and the contributions (COT-…, PAS-…)
#   through the gateway at install. December 2025's contributions, owed in the opening balance, are
#   paid on 15/01 under the pièces the payroll gives them (COT-URSSAF-2025-12…).
#
# A line on a collective account names its third party by code; an invoice's line on 401000,
# 404000 or 411000 carries its due date (lettering and the aged balance read it).
# Generated by design/validated/plan/donnees/demo/script-de-preparation/trimestre.py (prepared
