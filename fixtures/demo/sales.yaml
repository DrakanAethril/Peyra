#
# - `articles`: design/validated/plan/donnees/demo/articles.yaml read into this shape - raw
#   materials and consumables have no selling price; the services carry 20 %, the rate of a
#   professional customer (10 % is chosen on the line for works in an old dwelling, as in the
#   books of January). Prices are euros as text, read exactly. Checked by ArticleRules. Raw
#   materials and consumables carry their purchase price and its rate (`prix_achat_ht`, `tva_achat`).
# - `numbering`: the last number of each type the entries carry (FV-2026-0046 of 31/03,
#   AV-2026-001 of 30/01): the next invoice validated in the dossier is FV-2026-0047. The supplier
#   orders and receipts of January to the 20th of March (some nine a month, operations-2026.md § 1)
#   are counted, not written: the next order is CF-2026-0027, the next receipt BR-2026-0029.
# - `documents`: in order, each through SalesDocuments like the fiche; `validate` numbers it,
#   `made_from` is the rank of the document it was transformed from, `date` its own date. The
#   purchases: a price request to Panneaux Rhône-Loire; an order of glazing to the Miroiterie
#   Stéphanoise (the new tariff of January), received on the 26th and not invoiced yet - the
#   invoice not yet arrived of « Réceptions non facturées »; an order of oak to the Scierie, waiting.
